<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SGAF - Corregir Calificación</title>
    <style>
        :root {
            color-scheme: light;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #1e3c72;
            --text-secondary: #333333;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --btn-bg: #d35400;
            --btn-hover-bg: #a04000;
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg-color: #121824;
            --card-bg: #1e293b;
            --text-primary: #60a5fa;
            --text-secondary: #f1f5f9;
            --border-color: #334155;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --btn-bg: #2563eb;
            --btn-hover-bg: #1d4ed8;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 40px; color: var(--text-secondary); }
        .top-actions { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .form-container { background: var(--card-bg); padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 12px var(--shadow-color); border: 1px solid var(--border-color); }
        h2 { color: var(--text-primary); margin-top: 0; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--text-secondary); }
        input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 15px; background: transparent; color: var(--text-secondary); }
        textarea { height: 90px; resize: vertical; }
        .btn-submit { width: 100%; padding: 12px; background-color: var(--btn-bg); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-submit:hover { background-color: var(--btn-hover-bg); }
        .btn-back { display: inline-block; margin-bottom: 20px; color: var(--text-primary); text-decoration: none; font-weight: bold; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
        .alert-danger { background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            font-weight: bold;
        }
        .theme-toggle-btn:hover { background-color: rgba(255,255,255,0.08); transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="top-actions">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </div>

    <div class="form-container">
        <a href="javascript:history.back()" class="btn-back">← Volver Atrás</a>
        <h2>✏️ Corregir Nota con Auditoría</h2>
        <p style="color: #666; font-size: 14px;">Estudiante: <strong>{{ nota.estudiante.nombre }} {{ nota.estudiante.apellido }}</strong> (Materia: {{ nota.materia }})</p>

        {% if mensaje %}<div class="alert-success">{{ mensaje }}</div>{% endif %}
        {% if error %}<div class="alert-danger">{{ error }}</div>{% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="valor_nota">Nueva Nota (Actual: {{ nota.valor_nota }}):</label>
                <input type="number" step="0.01" min="0" max="5" name="valor_nota" id="valor_nota" value="{{ nota.valor_nota }}" required>
            </div>

            <div class="form-group">
                <label for="justificacion">Motivo de la corrección (Obligatorio):</label>
                <textarea name="justificacion" id="justificacion" placeholder="Ej: Error de digitación en la revisión del examen parcial." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Guardar Corrección y Auditar</button>
        </form>
    </div>

    <script>
        (function() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const storedTheme = localStorage.getItem('sgaf-theme') || 'light';
            const applyTheme = (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('sgaf-theme', theme);
                if (themeToggleBtn) {
                    themeToggleBtn.textContent = theme === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
                }
            };
            window.toggleTheme = function() {
                const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
            };
            applyTheme(storedTheme);
        })();
    </script>
</body>
</html>
