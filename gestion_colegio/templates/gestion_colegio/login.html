<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAF - Iniciar Sesión</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e9eff9;
            background: #181c27;
            overflow: hidden;
        }
        #particles-js {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.12), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.08), transparent 22%),
                        linear-gradient(180deg, #1b2030 0%, #131725 100%);
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(18, 56, 100, 0.24), rgba(5, 10, 25, 0.8));
            pointer-events: none;
            z-index: 1;
        }
        .login-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            position: relative;
            width: min(420px, 100%);
            background: rgba(6, 14, 32, 0.82);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            box-shadow: 0 30px 120px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            backdrop-filter: blur(14px);
        }
        .login-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(80, 200, 255, 0.14), rgba(76, 65, 255, 0.1));
            pointer-events: none;
        }
        .login-content {
            position: relative;
            padding: 40px 34px 36px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
        }
        .brand-icon {
            width: 54px;
            height: 54px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #31baf0, #5b5afe);
            box-shadow: 0 0 25px rgba(49, 186, 240, 0.24);
        }
        .brand-icon span {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: #fff;
        }
        .brand-title {
            display: grid;
            gap: 6px;
        }
        .brand-title h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .brand-title p {
            margin: 0;
            color: #a5b9d9;
            font-size: 0.96rem;
        }
        .login-intro {
            color: #cbd7f0;
            margin-bottom: 28px;
            line-height: 1.7;
            font-size: 0.95rem;
        }
        .form-group {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            color: #9ab6d5;
            font-size: 0.9rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: #eef3ff;
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input::placeholder {
            color: rgba(229, 241, 255, 0.5);
        }
        input:focus {
            border-color: rgba(48, 190, 255, 0.65);
            box-shadow: 0 0 0 3px rgba(48, 190, 255, 0.12);
        }
        .actions {
            display: grid;
            gap: 16px;
            margin-top: 8px;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #2fa7ff 0%, #6a5fff 100%);
            box-shadow: 0 14px 30px rgba(33, 135, 255, 0.24);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 35px rgba(33, 135, 255, 0.3);
        }
        .help-links {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 14px;
            font-size: 0.92rem;
            color: #8aa4d3;
        }
        .help-links a {
            color: #8aa4d3;
            text-decoration: none;
        }
        .help-links a:hover {
            color: #c8e4ff;
        }
        .error-msg {
            background: rgba(255, 85, 85, 0.12);
            border: 1px solid rgba(255, 85, 85, 0.18);
            color: #ffb3b3;
            padding: 14px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 0.94rem;
        }
        .login-footer {
            margin-top: 22px;
            color: #7f98c2;
            text-align: center;
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .login-footer strong {
            color: #dde7ff;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="login-wrapper">
        <section class="login-card">
            <div class="login-content">
                <div class="brand">
                    <div class="brand-icon"><span>SG</span></div>
                    <div class="brand-title">
                        <h1>SGAF</h1>
                        <p>Sistema de Gestión Académica y Financiera</p>
                    </div>
                </div>

                {% if error %}
                    <div class="error-msg">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <div class="actions">
                        <button type="submit">Continuar</button>
                    </div>
                    <div class="help-links">
                        <a href="#">Olvidé mi contraseña</a>
                        <a href="#">Registrarse</a>
                    </div>
                </form>
                <div class="login-footer">
                    <strong>SGAF</strong> - Seguridad, control financiero y gestión académica para instituciones educativas.
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 80,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#8cff9a'
                },
                shape: {
                    type: 'circle',
                    stroke: {
                        width: 0,
                        color: '#8cff9a'
                    },
                    polygon: {
                        nb_sides: 5
                    }
                },
                opacity: {
                    value: 0.5,
                    random: false,
                    anim: {
                        enable: false,
                        speed: 1,
                        opacity_min: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: {
                        enable: false,
                        speed: 40,
                        size_min: 0.1,
                        sync: false
                    }
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#8cff9a',
                    opacity: 0.6,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 6,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'out',
                    bounce: false,
                    attract: {
                        enable: false,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: {
                        enable: true,
                        mode: 'grab'
                    },
                    onclick: {
                        enable: true,
                        mode: 'push'
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 140,
                        line_linked: {
                            opacity: 1
                        }
                    },
                    bubble: {
                        distance: 400,
                        size: 40,
                        duration: 2,
                        opacity: 8,
                        speed: 3
                    },
                    repulse: {
                        distance: 200,
                        duration: 0.4
                    },
                    push: {
                        particles_nb: 4
                    },
                    remove: {
                        particles_nb: 2
                    }
                }
            },
            retina_detect: true
        });
    </script>
</body>
</html>
